version: 2.1

parameters:
  central-status:
    type: boolean
    default: false
  deployment-id:
    type: string
    default: ""

jobs:
  check-central-deployment:
    parameters:
      deployment-id:
        type: string
    docker:
      - image: cimg/python:3.12
    environment:
      DEPLOYMENT_ID: << parameters.deployment-id >>
    steps:
      - run:
          name: Read existing Central deployment status without publishing
          command: |
            set +x
            python3 - \<<'PY'
            import base64
            import json
            import os
            import urllib.error
            import urllib.request
            import uuid

            deployment_id = str(uuid.UUID(os.environ["DEPLOYMENT_ID"]))
            credentials = (os.environ["CENTRAL_USERNAME"] + ":" + os.environ["CENTRAL_PASSWORD"]).encode("utf-8")
            authorization = "Bearer " + base64.b64encode(credentials).decode("ascii")
            request = urllib.request.Request(
                "https://central.sonatype.com/api/v1/publisher/status?id=" + deployment_id,
                data=b"",
                headers={"Authorization": authorization},
                method="POST",
            )
            try:
                with urllib.request.urlopen(request, timeout=45) as response:
                    status = json.load(response)
            except urllib.error.HTTPError as failure:
                raise SystemExit("Central deployment-status request failed: HTTP " + str(failure.code))
            print(json.dumps({
                key: status[key]
                for key in ("deploymentId", "deploymentState", "purls", "errors")
                if key in status
            }, sort_keys=True, indent=2))
            PY

workflows:
  central-status:
    when: << pipeline.parameters.central-status >>
    jobs:
      - check-central-deployment:
          context: RELEASE_PROFILE_BBOTTEMA
          deployment-id: << pipeline.parameters.deployment-id >>
